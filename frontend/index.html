<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEVA Marketplace</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="sigil">✦</span>
      <h1>DEVA MARKETPLACE</h1>
    </div>
    <div id="user-bar" class="user-bar"></div>
  </header>

  <main class="container">
    <section id="auth-panel" class="card auth-card">
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Sign In</button>
        <button id="tab-register" class="tab" type="button">Create Account</button>
      </div>
      <form id="auth-form" class="stack">
        <input id="auth-name" type="text" placeholder="Display Name" class="hidden" />
        <input id="auth-email" type="email" placeholder="Email Address" required />
        <input id="auth-password" type="password" placeholder="Password (min 8 chars)" required />
        <button type="submit" class="btn-primary" id="auth-submit">Enter Vault</button>
      </form>
      <p id="auth-msg" class="msg"></p>
    </section>

    <section id="create-panel" class="card hidden">
      <h2>Publish New Listing</h2>
      <form id="listing-form" class="stack">
        <input id="item-title" type="text" placeholder="Item Title" maxlength="150" required />
        <textarea id="item-desc" rows="3" placeholder="Description, specs, or delivery notes"></textarea>
        <input id="item-price" type="number" step="0.01" min="0" placeholder="Price (USD)" required />
        <button type="submit" class="btn-gold">List Item</button>
      </form>
      <p id="listing-msg" class="msg"></p>
    </section>

    <section class="feed-section">
      <div class="feed-header">
        <h2>Active Offerings</h2>
        <button id="refresh-btn" class="btn-ghost" type="button">Refresh</button>
      </div>
      <div id="listings-grid" class="grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
